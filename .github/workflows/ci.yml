name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Vet applefm tag
        run: go vet -tags applefm ./...

      - name: Build for Windows
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: Test
        run: go test ./...
