name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: taiki-e/install-action@just

      - name: Lint
        run: just lint

      - name: Build consumer platform matrix
        run: just check cross-build

      - name: Test in isolated container
        if: runner.os == 'Linux'
        run: just test
